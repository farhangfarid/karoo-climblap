name: Build APK

# Trigger: runs automatically on every push to main,
# OR you can trigger it manually from the GitHub Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # ← "Run workflow" button in the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required by Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Gradle dependencies so subsequent builds are faster
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # 4. Make gradlew executable (git doesn't always preserve +x)
      - name: Make gradlew executable
        run: chmod +x gradlew​​​​​​​​​​​​​​​​
